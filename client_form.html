{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h4 class="text-white"><i class="fas fa-user-edit me-2"></i>{{ 'Editar cliente' if client else 'Novo cliente' }}</h4>
    <p class="text-muted">Preencha os dados do cliente.</p>
  </div>
  <div>
    <a href="{{ url_for('clients') }}" class="btn btn-outline-light"><i class="fas fa-arrow-left me-2"></i>Voltar</a>
  </div>
</div>
<form method="post">
  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label">Nome completo</label>
      <input type="text" name="full_name" class="form-control" required value="{{ client.full_name if client else '' }}">
    </div>
    <div class="col-md-3">
      <label class="form-label">CPF</label>
      <input type="text" name="cpf" class="form-control" value="{{ client.cpf if client else '' }}">
    </div>
    <div class="col-md-3">
      <label class="form-label">CNPJ</label>
      <input type="text" name="cnpj" class="form-control" value="{{ client.cnpj if client else '' }}">
    </div>
    <div class="col-12">
      <label class="form-label">Endereço completo</label>
      <input type="text" name="address" class="form-control" value="{{ client.address if client else '' }}">
    </div>
    <div class="col-md-4">
      <label class="form-label">Telefone</label>
      <input type="text" name="phone" class="form-control" value="{{ client.phone if client else '' }}">
    </div>
    <div class="col-md-4">
      <label class="form-label">WhatsApp</label>
      <input type="text" name="whatsapp" class="form-control" value="{{ client.whatsapp if client else '' }}">
    </div>
    <div class="col-md-4">
      <label class="form-label">E-mail</label>
      <input type="email" name="email" class="form-control" value="{{ client.email if client else '' }}">
    </div>
    <div class="col-12">
      <label class="form-label">Observações</label>
      <textarea name="notes" class="form-control" rows="4">{{ client.notes if client else '' }}</textarea>
    </div>
    <div class="col-12 text-end">
      <button type="submit" class="btn btn-primary">Salvar cliente</button>
    </div>
  </div>
</form>
{% endblock %}
