<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Gestão de Tarefas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.4/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  </head>
  <body class="d-flex align-items-center justify-content-center vh-100" style="background: linear-gradient(135deg, #eaf4ff, #f8fbff);">
    <div class="card p-5 shadow-lg rounded-4" style="max-width: 440px; width: 100%; background: #ffffff; border: 1px solid #e9ecef;">
      <div class="text-center mb-5">
        <span class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3" style="width: 74px; height: 74px; background: #d1fae5; color: #166534;">
          <i class="fas fa-wallet fa-2x"></i>
        </span>
        <h3 class="text-dark fw-bold">Acesse sua conta</h3>
        <p class="text-muted mb-0">Sistema de Gestão de Tarefas e Clientes</p>
      </div>
      <form method="POST">
        <div class="mb-3">
          <label class="form-label">Usuário</label>
          <input type="text" name="username" class="form-control" required autocomplete="username">
        </div>
        <div class="mb-3">
          <label class="form-label">Senha</label>
          <input type="password" name="password" class="form-control" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary w-100">Entrar</button>
      </form>
      <div class="mt-4 text-center text-muted small">
        Usuário padrão: <strong>admin</strong> / Senha: <strong>admin123</strong>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
