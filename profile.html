{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h4 class="text-white"><i class="fas fa-user-cog me-2"></i>Perfil</h4>
    <p class="text-muted">Atualize seu nome de usuário e senha.</p>
  </div>
  <div>
    <a href="{{ url_for('dashboard') }}" class="btn btn-outline-light"><i class="fas fa-arrow-left me-2"></i>Voltar</a>
  </div>
</div>
<form method="post">
  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label">Usuário</label>
      <input type="text" name="username" class="form-control" required value="{{ current_user.username }}">
    </div>
    <div class="col-md-6">
      <label class="form-label">Senha atual</label>
      <input type="password" name="current_password" class="form-control" required>
    </div>
    <div class="col-md-6">
      <label class="form-label">Nova senha</label>
      <input type="password" name="new_password" class="form-control" placeholder="Deixe em branco para manter a atual">
    </div>
    <div class="col-md-6">
      <label class="form-label">Confirmar nova senha</label>
      <input type="password" name="confirm_password" class="form-control" placeholder="Deixe em branco para manter a atual">
    </div>
    <div class="col-12 text-end">
      <button type="submit" class="btn btn-primary">Salvar alterações</button>
    </div>
  </div>
</form>
{% endblock %}
