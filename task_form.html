{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h4 class="text-white"><i class="fas fa-edit me-2"></i>{{ 'Editar tarefa' if task else 'Nova tarefa' }}</h4>
    <p class="text-muted">Registre informações da tarefa e acompanhe o progresso.</p>
  </div>
  <div>
    <a href="{{ url_for('tasks') }}" class="btn btn-outline-light"><i class="fas fa-arrow-left me-2"></i>Voltar</a>
  </div>
</div>
<form method="post">
  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label">Cliente</label>
      <select name="client_id" class="form-select" required>
        {% for client in clients %}
          <option value="{{ client.id }}" {% if task and task.client_id == client.id %}selected{% endif %}>{{ client.full_name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-6">
      <label class="form-label">Responsável</label>
      <input type="text" name="responsible" class="form-control" value="{{ task.responsible if task else '' }}">
    </div>
    <div class="col-12">
      <label class="form-label">Descrição da tarefa</label>
      <textarea name="description" class="form-control" rows="4" required>{{ task.description if task else '' }}</textarea>
    </div>
    <div class="col-md-4">
      <label class="form-label">Prazo</label>
      <input type="date" name="deadline" class="form-control" value="{{ task.deadline.strftime('%Y-%m-%d') if task and task.deadline else '' }}">
    </div>
    <div class="col-md-4">
      <label class="form-label">Data de conclusão</label>
      <input type="date" name="completed_at" class="form-control" value="{{ task.completed_at.strftime('%Y-%m-%d') if task and task.completed_at else '' }}">
    </div>
    <div class="col-md-4">
      <label class="form-label">Valor do serviço</label>
      <input type="number" name="service_value" class="form-control" step="0.01" value="{{ task.service_value if task else '0.00' }}">
    </div>
    <div class="col-md-4">
      <label class="form-label">Prioridade</label>
      <select name="priority" class="form-select">
        {% for priority in PRIORITIES %}
          <option value="{{ priority }}" {% if task and task.priority == priority %}selected{% endif %}>{{ priority }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-4">
      <label class="form-label">Status</label>
      <select name="status" class="form-select">
        {% for status in STATUS_CHOICES %}
          <option value="{{ status }}" {% if task and task.status == status %}selected{% endif %}>{{ status }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-4">
      <label class="form-label">Forma de pagamento</label>
      <select name="payment_method" class="form-select">
        {% for method in PAYMENT_METHODS %}
          <option value="{{ method }}" {% if task and task.payment_method == method %}selected{% endif %}>{{ method }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-12">
      <label class="form-label">Observações</label>
      <textarea name="notes" class="form-control" rows="3">{{ task.notes if task else '' }}</textarea>
    </div>
    <div class="col-12">
      <label class="form-label">Senhas e acessos</label>
      <textarea name="access_info" class="form-control" rows="3">{{ task.access_info if task else '' }}</textarea>
    </div>
    <div class="col-12 text-end">
      <button type="submit" class="btn btn-primary">Salvar tarefa</button>
    </div>
  </div>
</form>
{% endblock %}
